[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollikit"
dynamic = ["version"]
description = "Modern Python package for bioinformatics, oligonucleotide analysis, affinity calculation, physicochemical and neural network predictors, concentration solving, and optimal sequence finding"
readme = "README.md"

license = {text = "MIT"}
keywords = [
    "bioinformatics",
    "oligonucleotides",
    "dna",
    "rna",
    "affinity",
    "nupack",
    "hairpin",
    "concentration",
    "sequence-design",
    "biochemistry"
]
authors = [
  { name = "nikitinlab", email = "725156@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.9"

dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "pytest"
]

[project.urls]
Documentation = "https://github.com/nikitinlab/ollikit#readme"
Issues = "https://github.com/nikitinlab/ollikit/issues"
Source = "https://github.com/nikitinlab/ollikit"

[tool.hatch.version]
path = "src/ollikit/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/ollikit tests}"

[tool.coverage.run]
source_pkgs = ["ollikit", "tests"]
branch = true
parallel = true
omit = [
  "src/ollikit/__about__.py",
]

[tool.coverage.paths]
ollikit = ["src/ollikit", "*/ollikit/src/ollikit"]
tests = ["tests", "*/ollikit/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
# Настройки для pytest
testpaths = ["tests", "tests_oligama"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Подавление warnings от внешних зависимостей
filterwarnings = [
    # Игнорировать deprecation warnings от внешних библиотек
    "ignore::DeprecationWarning:seqfold.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    # Игнорировать предупреждения joblib о воркерах (если не критично)
    "ignore::UserWarning:joblib.*",
    # НЕ подавляем наши UserWarning - они информативны для пользователя
]
